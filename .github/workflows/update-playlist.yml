name: Update EX-YU IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-exyu-playlist
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py --output EXYU_Free_TV.m3u8

      - name: Commit updated playlist
        shell: bash
        run: |
          if git diff --quiet -- EXYU_Free_TV.m3u8 && git ls-files --error-unmatch EXYU_Free_TV.m3u8 >/dev/null 2>&1; then
            echo "Playlist has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXYU_Free_TV.m3u8
          git commit -m "Update EX-YU IPTV playlist"
          git push
